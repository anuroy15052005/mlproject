<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Student Exam Performance</title>
        <link rel="stylesheet" href="/static/css/style.css">
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    </head>
    <body>
        <div class="container">
            <div class="card">
                <div class="header">
                    <div class="logo"><i class="fa fa-calculator" aria-hidden="true"></i></div>
                    <div>
                        <h2 class="title">Student Exam Performance Indicator</h2>
                        <p class="subtitle">Predict the Math score from student attributes</p>
                    </div>
                </div>

                <form action="{{ url_for('predict_datapoint') }}" method="post">
                    <div class="form-row">
                        <div class="form-col">
                            <label>Gender</label>
                            <select name="gender" required>
                                <option value="" disabled selected>Select your Gender</option>
                                <option value="male">Male</option>
                                <option value="female">Female</option>
                            </select>
                        </div>
                        <div class="form-col">
                            <label>Race or Ethnicity</label>
                            <select name="ethnicity" required>
                                <option value="" disabled selected>Select Ethnicity</option>
                                <option value="group A">Group A</option>
                                <option value="group B">Group B</option>
                                <option value="group C">Group C</option>
                                <option value="group D">Group D</option>
                                <option value="group E">Group E</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-col">
                            <label>Parental Level of Education</label>
                            <select name="parental_level_of_education" required>
                                <option value="" disabled selected>Select Parent Education</option>
                                <option value="associate's degree">associate's degree</option>
                                <option value="bachelor's degree">bachelor's degree</option>
                                <option value="high school">high school</option>
                                <option value="master's degree">master's degree</option>
                                <option value="some college">some college</option>
                                <option value="some high school">some high school</option>
                            </select>
                        </div>
                        <div class="form-col">
                            <label>Lunch Type</label>
                            <select name="lunch" required>
                                <option value="" disabled selected>Select Lunch Type</option>
                                <option value="free/reduced">free/reduced</option>
                                <option value="standard">standard</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-col">
                            <label>Test Preparation Course</label>
                            <select name="test_preparation_course" required>
                                <option value="" disabled selected>Select Test Course</option>
                                <option value="none">None</option>
                                <option value="completed">Completed</option>
                            </select>
                        </div>
                        <div class="form-col">
                            <label>Writing Score (out of 100)</label>
                            <input type="number" name="writing_score" min="0" max="100" />
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-col">
                            <label>Reading Score (out of 100)</label>
                            <input type="number" name="reading_score" min="0" max="100" />
                        </div>
                        <div class="form-col" style="align-self:flex-end">
                            <button class="btn" type="submit"><i class="fa fa-magic" aria-hidden="true"></i> Predict your Maths Score</button>
                        </div>
                    </div>
                </form>

                {% if results is defined %}
                <div class="result">Prediction: <strong>{{ results }}</strong></div>
                {% endif %}

                
            </div>
        </div>
    </body>
</html>
